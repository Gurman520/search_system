<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Поиск товаров{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .main-content {
            flex: 1;
        }
        .logo-img { max-height: 40px; }
        .admin-btn { font-size: 1.5rem; color: #6c757d; text-decoration: none; }
        .admin-btn:hover { color: #000; }
        .search-block { margin-top: 50px; }
        footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #e9ecef;
        }

        /* Анимация появления контента при смене страницы/вкладки */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        main {
            animation: fadeInUp 0.35s ease-out;
        }

        /* Плавные переходы у вкладок nav-tabs */
        .nav-tabs .nav-link {
            position: relative;
            transition: color 0.25s ease, background-color 0.25s ease, transform 0.2s ease;
        }
        .nav-tabs .nav-link:hover:not(.active) {
            color: #0d6efd;
            transform: translateY(-1px);
        }
        .nav-tabs .nav-link.active {
            font-weight: 600;
        }
        /* Плавно растущая линия под активной вкладкой */
        .nav-tabs .nav-link::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1px;
            width: 0;
            height: 2px;
            background-color: #0d6efd;
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }
        .nav-tabs .nav-link.active::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                {% if settings.LOGO_PATH %}
                    <img src="{{ settings.LOGO_PATH }}" alt="Логотип" class="logo-img me-2">
                {% else %}
                    <span class="fs-4 me-2">🏢</span>
                {% endif %}
                <span>Поиск товаров</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                {% if request.state.user %}
                    <a href="/admin" class="icon-btn" title="Админка">⚙️</a>
                    <div class="dropdown">
                        <a href="#" class="icon-btn dropdown-toggle" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false" title="Пользователь" style="text-decoration:none;">👤</a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                            <li><span class="dropdown-item-text fw-bold">{{ request.state.user.first_name }} {{ request.state.user.last_name }}</span></li>
                            <li><span class="dropdown-item-text text-muted small">{{ request.state.user.login }}</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form action="/logout" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Выйти</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                {% endif %}
            </div>
            <!-- <a href="/admin" class="admin-btn" title="Админка">⚙️</a> -->
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <footer class="mt-auto">
        <div class="container">
            <span class="text-muted">© 2026 Сулима Р.И. | Попова А.А. </span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
