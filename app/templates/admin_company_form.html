{% extends "base.html" %}
{% block title %}{{ 'Редактировать' if company else 'Добавить' }} компанию{% endblock %}
{% block content %}
<h2>{{ 'Редактировать' if company else 'Добавить' }} компанию</h2>
{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
<form method="post" action="{% if company %}/admin/companies/{{ company.id }}/edit{% else %}/admin/companies/add{% endif %}">
    <div class="mb-3">
        <label for="name" class="form-label">Наименование *</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ company.name if company else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Телефон</label>
        <input type="text" name="phone" id="phone" class="form-control" value="{{ company.phone if company else '' }}">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ company.email if company else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/admin/companies" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
